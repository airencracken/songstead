name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, shared family pin
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7, shared family pin
        with:
          go-version: '1.26.x'
      - name: Resolve published dependencies
        run: go mod download
      - name: Check and build
        env:
          GOWORK: 'off'
        run: make check build
