name: Checks
on: [push, pull_request]
permissions:
  contents: read
env:
  GOWORK: 'off'
defaults:
  run:
    shell: bash --noprofile --norc {0}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, shared family pin
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7, shared family pin
        with:
          go-version: '1.26.x'
      - name: Resolve published dependencies
        run: |
          go mod download || exit 1
          go mod verify || exit 1
          git diff --exit-code -- go.mod go.sum || exit 1
      - name: Install Bubblewrap for native integration
        run: |
          sudo apt-get update || exit 1
          sudo apt-get install -y bubblewrap || exit 1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || exit 1
      - name: Check and build
        run: make check test-sandbox build
