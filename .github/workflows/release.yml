name: Release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild with the current workflow'
        type: string
        required: false
        default: ''
permissions:
  contents: read
env:
  GOWORK: 'off'
  RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
defaults:
  run:
    shell: bash --noprofile --norc {0}
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate requested release source
        env:
          RELEASE_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          # Validate an explicitly requested existing release tag.
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            [[ "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
            release_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG_INPUT^{commit}") || exit 1
            test "$release_commit" = "$(git rev-parse HEAD)" || exit 1
          fi
          case "$RELEASE_REF" in
            refs/tags/v*)
              git merge-base --is-ancestor HEAD origin/master || exit 1
              if [ -f VERSION ]; then
                test "$RELEASE_REF" = "refs/tags/v$(cat VERSION)" || exit 1
              fi
              ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.11'
      - name: Install Bubblewrap for native integration
        run: |
          sudo apt-get update || exit 1
          sudo apt-get install -y bubblewrap zstd || exit 1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || exit 1
      - name: Validate release on master
        env:
          RELEASE_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v*)
              git merge-base --is-ancestor HEAD origin/master || exit 1
              test "$RELEASE_REF" = "refs/tags/v$(cat VERSION)" || exit 1
              ;;
          esac
          go mod download || exit 1
          git diff --exit-code -- go.mod go.sum || exit 1
          make check test-sandbox build || exit 1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.2
          install-only: true
      - name: Build native archives without publishing
        env:
          RELEASE_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          goreleaser check || exit 1
          case "$RELEASE_REF" in
            refs/tags/v*) goreleaser release --clean --skip=publish || exit 1 ;;
            *) goreleaser release --snapshot --clean --skip=publish || exit 1 ;;
          esac
      - name: Verify release archives and source documentation
        run: python3 scripts/containers/check_artifacts.py
      - name: Scan release executable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 || exit 1
          python3 scripts/scan_artifacts.py dist/*_linux_*.tar.gz --scanner "$(go env GOPATH)/bin/govulncheck" || exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt


  containers:
    needs: [build]
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      publish: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')) && github.repository == 'airencracken/songstead' }}

  publish:
    if: (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')) && github.repository == 'airencracken/songstead'
    needs: [build, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: dist
      - name: Publish tested artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft; then
            [ "$(cat release-draft)" = true ] || { echo 'Release already published; refusing to replace it.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "songstead $RELEASE_TAG" || exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber || exit 1
          case "$RELEASE_TAG" in
            *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease || exit 1 ;;
            *) gh release edit "$RELEASE_TAG" --draft=false || exit 1 ;;
          esac
