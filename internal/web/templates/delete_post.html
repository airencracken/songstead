{{define "delete-post"}}<section class="panel stack"><h1>Delete your post?</h1><h2>{{.Item.Title}}</h2>{{if .Item.Artist}}<p>{{.Item.Artist}}</p>{{end}}{{if .Item.Note}}<blockquote class="user-text">{{.Item.Note}}</blockquote>{{end}}<p>This permanently removes this post and its comments. Other recommendations of this music and private song likes remain.</p><form action="/recommendations/{{.Item.ID}}/delete" method="post" class="stack"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="confirm" value="delete"><button type="submit">Delete post permanently</button><a href="/recommendations/{{.Item.ID}}">Cancel</a></form></section>{{end}}
