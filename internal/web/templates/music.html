{{define "spoiler-field"}}<label>Spoiler preference<select name="mode"><option value="immediate" {{if eq .AnnotationMode "immediate"}}selected{{end}}>Show immediately</option><option value="spoiler-free" {{if eq .AnnotationMode "spoiler-free"}}selected{{end}}>Spoiler-free</option><option value="hidden" {{if eq .AnnotationMode "hidden"}}selected{{end}}>Hidden</option></select></label>{{end}}
{{define "label-fields"}}<label>Genre<input name="genre" value="{{.Genre}}" maxlength="80" placeholder="Any genre name"></label><label>Tags<input name="tags" value="{{.Tags}}" maxlength="4096" placeholder="Acoustic, live, late-night"></label><p class="muted">Optional freeform descriptions. Use up to 20 comma-separated tags, each up to 40 characters.</p>{{end}}
{{define "music-labels"}}<div class="music-chips">{{if .Genre}}<a class="badge" href="{{labelLink "genre" .Genre}}">{{.Genre}}</a>{{end}}{{range .Tags}}<a class="badge" href="{{labelLink "tag" .}}">{{.}}</a>{{end}}</div>{{end}}

{{define "avatar"}}<picture class="avatar"><source media="(prefers-reduced-motion: reduce)" srcset="/users/{{.}}/picture?still=1"><img src="/users/{{.}}/picture" width="28" height="28" alt="" loading="lazy"></picture>{{end}}
