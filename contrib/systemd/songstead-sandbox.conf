# Install as /etc/systemd/system/songstead.service.d/sandbox.conf.
# The service data directory must exist; run the check as the service user.
[Service]
ExecStart=
ExecStart=/usr/local/bin/songstead sandbox
TimeoutStopSec=25
# Bubblewrap needs user, PID, IPC and UTS namespaces; retain the host network.
RestrictNamespaces=user pid ipc uts mnt
